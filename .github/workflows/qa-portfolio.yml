name: Verify portfolio readability
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/qa-readability-v20.cjs'
      - '.github/workflows/qa-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node --check assets/continuous-deck-v6.js
          node --check assets/app-navigation.js
          node --check assets/mobile-app-v10.js
          node --check scripts/qa-readability-v20.cjs
      - name: Desktop and Android-sized readability checks
        run: node scripts/qa-readability-v20.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-readability-screenshots
          path: qa-screens/readability-*.png
          if-no-files-found: ignore
          retention-days: 3
