name: Verify portfolio HD carousel
on:
  push:
    paths:
      - '.github/workflows/qa-portfolio.yml'
      - 'scripts/qa-portfolio-carousel.cjs'
      - 'scripts/qa-screen-deck.cjs'
      - 'scripts/qa-continuous-deck.cjs'
      - 'scripts/qa-work-fit.cjs'
      - 'scripts/qa-presentation-fit.cjs'
      - 'scripts/qa-resume-consistency.cjs'
      - 'scripts/qa-live-portfolio.cjs'
      - 'scripts/qa-mobile-app-v10.cjs'
      - 'assets/mobile-app-v10.js'
      - 'assets/mobile-app-v10.css'
      - 'assets/mobile-dock-v11.css'
      - 'assets/mobile-dock-overlay-v12.css'
      - 'scripts/qa-mobile-dock-overlay-v12.cjs'
      - 'assets/presentation-fit-v8.css'
      - 'assets/presentation-fit-v8.js'
      - 'assets/resume-focus-v9.css'
      - 'scripts/diag-screen-fit.cjs'
      - 'assets/work-card-fit-v7.css'
      - 'assets/continuous-deck-v6.js'
      - 'assets/continuous-deck-v6.css'
      - 'assets/screen-deck-v5.js'
      - 'assets/screen-deck-v5.css'
      - 'assets/app-navigation.js'
      - 'index.html'
      - 'assets/portfolio-motion.js'
      - 'assets/carousel-hd-v4.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node --check assets/portfolio-motion.js
          node --check assets/app-navigation.js
          node --check assets/mobile-app-v10.js
          node --check scripts/qa-mobile-app-v10.cjs
          node --check scripts/qa-mobile-dock-overlay-v12.cjs
          node --check assets/site.js
          node --check assets/screen-deck-v5.js
          node --check scripts/qa-continuous-deck.cjs
          node --check assets/continuous-deck-v6.js
          node --check scripts/qa-presentation-fit.cjs
          node --check scripts/qa-resume-consistency.cjs
          node --check scripts/qa-live-portfolio.cjs
          node --check assets/presentation-fit-v8.js
      - name: Desktop and Android-sized carousel checks
        run: node scripts/qa-portfolio-carousel.cjs
      - name: Preserve desktop continuous-scroll layout
        run: node scripts/qa-continuous-deck.cjs
      - name: Android-style mobile tabs, browser history and theme cap
        run: node scripts/qa-mobile-app-v10.cjs
      - name: Floating theme orbit attached to Contact without extra page space
        run: node scripts/qa-mobile-dock-overlay-v12.cjs
      - name: Resume-focused layout and readable projects across viewports
        run: node scripts/qa-presentation-fit.cjs
      - name: Audit uploaded resume coverage and desktop/mobile hitboxes
        run: node scripts/qa-resume-consistency.cjs
      - name: Measure viewport fit on eight screen sizes
        run: node scripts/diag-screen-fit.cjs
      - name: Verify the deployed HTTPS site in desktop and mobile Chromium
        run: node scripts/qa-live-portfolio.cjs
      - name: Upload production desktop and mobile screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-live-responsive-screenshots
          path: qa-screens/live-*.png
          if-no-files-found: error
          retention-days: 3
      - name: Upload screenshots if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-qa-failure
          path: qa-screens/
          if-no-files-found: ignore
